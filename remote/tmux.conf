set-option -ga update-environment XDG_RUNTIME_DIR

# --- robustness hardening ---

# Keep the server alive even when the last client detaches/dies,
# so a wedged or disconnected -CC client never takes the session with it.
set-option -g destroy-unattached off
set-option -g exit-empty off

# NOTE: tmux has no built-in "kill dead client" timeout. A half-dead iTerm2
# -CC control client after a network drop can wedge the server's event loop.
# Recovery from that is handled by the `devbox-tmux` helper, which sends
# SIGUSR1 to the server (re-creates its socket / re-scans clients) and falls
# back to killing stale clients — all without losing the session.

# Don't let a small client constrain the real session size.
# NOTE: aggressive-resize is INCOMPATIBLE with iTerm2's -CC tmux integration
# (iTerm2 drives window sizing itself), so it must stay off.
set-option -g window-size latest
set-option -g aggressive-resize off

# Larger scrollback so reattaching keeps useful history.
set-option -g history-limit 50000
